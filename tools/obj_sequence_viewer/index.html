<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OBJ Sequence Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --muted: #8b93a7;
      --text: #edf1f7;
      --accent: #7cc7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid #252a35;
    }
    .toolbar strong { font-size: 14px; }
    .toolbar .meta {
      color: var(--muted);
      font-size: 13px;
      margin-right: auto;
    }
    button, input[type="range"] {
      cursor: pointer;
    }
    button {
      background: #242a37;
      color: var(--text);
      border: 1px solid #394154;
      border-radius: 8px;
      padding: 8px 12px;
    }
    button:hover { border-color: var(--accent); }
    label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .frame-slider {
      min-width: 280px;
      flex: 1 1 320px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at top, #161d2b 0%, #0b0d12 70%);
    }
    .hint {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: rgba(23, 26, 33, 0.88);
      border: 1px solid #2d3445;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong id="title">Loading...</strong>
    <span class="meta" id="meta"></span>
    <button id="play">Pause</button>
    <label>Frame
      <input id="frame" class="frame-slider" type="range" min="0" max="0" value="0" step="1" />
      <span id="frameLabel">0 / 0</span>
    </label>
    <label>FPS
      <input id="fps" type="range" min="1" max="30" value="12" step="1" />
      <span id="fpsLabel">12</span>
    </label>
    <button id="resetView">Reset View</button>
  </div>
  <canvas id="canvas"></canvas>
  <div class="hint">
    Drag: rotate<br />
    Wheel: zoom<br />
    Space: play / pause
  </div>

  <script>
    const state = {
      manifest: null,
      meshes: new Map(),
      frame: 0,
      playing: true,
      lastTs: 0,
      fps: 12,
      yaw: -0.9,
      pitch: 0.45,
      distance: 5.2,
      targetDistance: 5.2,
      center: [0, 1, 0],
      radius: 1.6,
      pointerDown: false,
      lastPointer: null,
    };

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const playEl = document.getElementById("play");
    const frameEl = document.getElementById("frame");
    const frameLabelEl = document.getElementById("frameLabel");
    const fpsEl = document.getElementById("fps");
    const fpsLabelEl = document.getElementById("fpsLabel");
    const resetViewEl = document.getElementById("resetView");

    const componentPalette = [
      { fill: [106, 197, 255], stroke: "rgba(160,220,255,0.95)" },
      { fill: [180, 185, 196], stroke: "rgba(230,235,245,0.92)" },
      { fill: [255, 170, 110], stroke: "rgba(255,220,180,0.95)" },
      { fill: [180, 255, 170], stroke: "rgba(215,255,205,0.95)" },
    ];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, canvas.clientWidth);
      const h = Math.max(1, canvas.clientHeight);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function parseOBJ(text) {
      const vertices = [];
      const faces = [];
      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line || line.startsWith("#")) continue;
        const parts = line.split(/\s+/);
        if (parts[0] === "v" && parts.length >= 4) {
          vertices.push(parts.slice(1, 4).map(Number));
        } else if (parts[0] === "f" && parts.length >= 4) {
          const ids = parts.slice(1).map((token) => Number(token.split("/")[0]) - 1);
          for (let i = 1; i + 1 < ids.length; i++) {
            faces.push([ids[0], ids[i], ids[i + 1]]);
          }
        }
      }
      return { vertices, faces, components: labelComponents(vertices.length, faces) };
    }

    function labelComponents(vertexCount, faces) {
      const adjacency = Array.from({ length: vertexCount }, () => new Set());
      for (const [a, b, c] of faces) {
        adjacency[a].add(b); adjacency[a].add(c);
        adjacency[b].add(a); adjacency[b].add(c);
        adjacency[c].add(a); adjacency[c].add(b);
      }

      const labels = Array(vertexCount).fill(-1);
      let componentId = 0;
      for (let start = 0; start < vertexCount; start++) {
        if (labels[start] !== -1) continue;
        const queue = [start];
        labels[start] = componentId;
        for (let i = 0; i < queue.length; i++) {
          const node = queue[i];
          for (const next of adjacency[node]) {
            if (labels[next] !== -1) continue;
            labels[next] = componentId;
            queue.push(next);
          }
        }
        componentId++;
      }
      return labels;
    }

    async function getMesh(frameIndex) {
      if (state.meshes.has(frameIndex)) return state.meshes.get(frameIndex);
      const name = state.manifest.frames[frameIndex];
      const response = await fetch(`/frames/${encodeURIComponent(name)}`);
      const text = await response.text();
      const mesh = parseOBJ(text);
      state.meshes.set(frameIndex, mesh);
      if (frameIndex === 0) updateBounds(mesh);
      return mesh;
    }

    function updateBounds(mesh) {
      const mins = [Infinity, Infinity, Infinity];
      const maxs = [-Infinity, -Infinity, -Infinity];
      for (const v of mesh.vertices) {
        for (let i = 0; i < 3; i++) {
          mins[i] = Math.min(mins[i], v[i]);
          maxs[i] = Math.max(maxs[i], v[i]);
        }
      }
      state.center = mins.map((m, i) => (m + maxs[i]) * 0.5);
      const span = Math.max(maxs[0] - mins[0], maxs[1] - mins[1], maxs[2] - mins[2]);
      state.radius = Math.max(0.8, span * 0.8);
      state.distance = span * 2.8;
      state.targetDistance = state.distance;
    }

    function rotatePoint([x, y, z]) {
      const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
      const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);

      let rx = x * cy + z * sy;
      let rz = -x * sy + z * cy;
      let ry = y;

      const py = ry * cp - rz * sp;
      const pz = ry * sp + rz * cp;
      return [rx, py, pz];
    }

    function projectPoint(world, w, h) {
      const shifted = [
        world[0] - state.center[0],
        world[1] - state.center[1],
        world[2] - state.center[2],
      ];
      const [x, y, z] = rotatePoint(shifted);
      const cameraZ = z + state.targetDistance;
      const focal = Math.min(w, h) * 0.52;
      return {
        x: w * 0.5 + (x * focal) / cameraZ,
        y: h * 0.5 - (y * focal) / cameraZ,
        z: cameraZ,
        rx: x,
        ry: y,
        rz: z,
      };
    }

    function shadeColor(base, light) {
      const c = base.map((v) => Math.max(0, Math.min(255, Math.round(v * light))));
      return `rgb(${c[0]} ${c[1]} ${c[2]})`;
    }

    async function render() {
      const mesh = await getMesh(state.frame);
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      const projected = mesh.vertices.map((v) => projectPoint(v, width, height));
      const light = normalize([0.4, 0.8, 1.0]);

      const tris = mesh.faces.map((face) => {
        const a = projected[face[0]];
        const b = projected[face[1]];
        const c = projected[face[2]];
        const normal = normalize(cross(
          [b.rx - a.rx, b.ry - a.ry, b.rz - a.rz],
          [c.rx - a.rx, c.ry - a.ry, c.rz - a.rz]
        ));
        const faceComp = mesh.components[face[0]] % componentPalette.length;
        const shade = Math.max(0.28, dot(normal, light) * 0.72 + 0.48);
        return {
          face,
          depth: (a.z + b.z + c.z) / 3,
          normal,
          fill: shadeColor(componentPalette[faceComp].fill, shade),
          stroke: componentPalette[faceComp].stroke,
        };
      }).sort((lhs, rhs) => rhs.depth - lhs.depth);

      for (const tri of tris) {
        const [ia, ib, ic] = tri.face;
        const a = projected[ia], b = projected[ib], c = projected[ic];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y);
        ctx.closePath();
        ctx.fillStyle = tri.fill;
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = tri.stroke;
        ctx.stroke();
      }

      drawAxis(width, height);
      frameLabelEl.textContent = `${state.frame} / ${state.manifest.frameCount - 1}`;
      metaEl.textContent = `${state.manifest.frameCount} frames`;
    }

    function drawAxis(width, height) {
      const origin = projectPoint(state.center, width, height);
      const axisScale = state.radius * 0.9;
      const axes = [
        { dir: [axisScale, 0, 0], color: "#ff6b6b" },
        { dir: [0, axisScale, 0], color: "#84f59b" },
        { dir: [0, 0, axisScale], color: "#73b7ff" },
      ];
      for (const axis of axes) {
        const tip = projectPoint([
          state.center[0] + axis.dir[0],
          state.center[1] + axis.dir[1],
          state.center[2] + axis.dir[2],
        ], width, height);
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(tip.x, tip.y);
        ctx.strokeStyle = axis.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }

    function dot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function normalize(v) {
      const len = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / len, v[1] / len, v[2] / len];
    }

    async function tick(ts) {
      if (!state.lastTs) state.lastTs = ts;
      const frameStepMs = 1000 / state.fps;
      if (state.playing && ts - state.lastTs >= frameStepMs) {
        state.frame = (state.frame + 1) % state.manifest.frameCount;
        frameEl.value = String(state.frame);
        state.lastTs = ts;
        getMesh((state.frame + 1) % state.manifest.frameCount).catch(() => {});
      }
      await render();
      requestAnimationFrame(tick);
    }

    function setPlaying(playing) {
      state.playing = playing;
      playEl.textContent = playing ? "Pause" : "Play";
    }

    async function init() {
      const response = await fetch("/api/manifest");
      state.manifest = await response.json();
      state.fps = state.manifest.fps;

      titleEl.textContent = state.manifest.title;
      frameEl.max = String(state.manifest.frameCount - 1);
      fpsEl.value = String(state.fps);
      fpsLabelEl.textContent = String(state.fps);

      await getMesh(0);
      resizeCanvas();
      requestAnimationFrame(tick);
    }

    playEl.addEventListener("click", () => setPlaying(!state.playing));
    frameEl.addEventListener("input", (event) => {
      state.frame = Number(event.target.value);
      state.lastTs = 0;
      setPlaying(false);
    });
    fpsEl.addEventListener("input", (event) => {
      state.fps = Number(event.target.value);
      fpsLabelEl.textContent = String(state.fps);
    });
    resetViewEl.addEventListener("click", async () => {
      const mesh = await getMesh(0);
      updateBounds(mesh);
      state.yaw = -0.9;
      state.pitch = 0.45;
    });

    canvas.addEventListener("pointerdown", (event) => {
      state.pointerDown = true;
      state.lastPointer = [event.clientX, event.clientY];
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointerup", (event) => {
      state.pointerDown = false;
      state.lastPointer = null;
      canvas.releasePointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!state.pointerDown || !state.lastPointer) return;
      const dx = event.clientX - state.lastPointer[0];
      const dy = event.clientY - state.lastPointer[1];
      state.lastPointer = [event.clientX, event.clientY];
      state.yaw += dx * 0.01;
      state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch + dy * 0.01));
    });
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      state.targetDistance = Math.max(1.2, state.targetDistance * (1 + event.deltaY * 0.001));
    }, { passive: false });

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        setPlaying(!state.playing);
      } else if (event.code === "ArrowRight") {
        setPlaying(false);
        state.frame = Math.min(state.frame + 1, state.manifest.frameCount - 1);
        frameEl.value = String(state.frame);
      } else if (event.code === "ArrowLeft") {
        setPlaying(false);
        state.frame = Math.max(state.frame - 1, 0);
        frameEl.value = String(state.frame);
      }
    });

    init().catch((error) => {
      titleEl.textContent = "Failed to load viewer";
      metaEl.textContent = String(error);
      console.error(error);
    });
  </script>
</body>
</html>
